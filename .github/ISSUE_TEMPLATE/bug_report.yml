name: Bug report
description: Report a reproducible problem with HeimForge
title: "fix: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a HeimForge problem.

        Do not include credentials, private keys, access tokens, private server
        configuration, or other secrets. Security vulnerabilities should follow
        SECURITY.md instead of being reported here.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Generator / bootstrap
        - Generated template
        - Metadata / validation
        - Build / test tooling
        - Packaging
        - Deployment
        - Documentation
        - Release automation
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: HeimForge version or commit
      description: Release tag or commit SHA where the problem occurs.
      placeholder: "v0.7.1 or abc1234"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include OS/WSL distribution and relevant Python/.NET versions.
      placeholder: "WSL2 Ubuntu 24.04, Python 3.12, .NET 8"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest sequence that reliably reproduces the problem.
      placeholder: |
        1. Run ...
        2. Generate ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste relevant logs or error output after removing secrets and private data.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed credentials, private configuration, and other secrets from the report.
          required: true
        - label: This concerns HeimForge or generated HeimForge infrastructure, not Vibeheim-specific gameplay.
          required: true
